<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover,
                                 maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#171232">
  <title>BrawlZ: Cursed Arenas — 3D</title>
  <link rel="stylesheet" href="css/game3d.css">
</head>
<body>

  <!-- ---------------- character select ---------------- -->
  <section id="menu" class="menu" hidden>
    <header class="menu-head">
      <h1 id="menu-title">BrawlZ</h1>
      <span id="menu-version" class="badge"></span>
      <p class="menu-hint">
        בחר לוחם. הזז עם הג׳ויסטיק השמאלי או עם <kbd>WASD</kbd>.
      </p>
    </header>
    <div id="character-list" class="char-list"></div>
    <footer class="menu-foot">
      <a class="link-2d" href="index.html">← לגרסת הדו־ממד</a>
    </footer>
  </section>

  <!-- ---------------- match ---------------- -->
  <div id="stage" class="stage">
    <canvas id="game-canvas"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="hud-card hud-card--player">
          <span class="hud-name" id="hud-player-name"></span>
          <div class="bar"><i id="hud-player-hp" class="bar-fill"></i></div>
          <span class="hud-hp" id="hud-player-hp-text"></span>
        </div>
        <div class="hud-card hud-card--enemy">
          <span class="hud-name" id="hud-enemy-name"></span>
          <div class="bar"><i id="hud-enemy-hp" class="bar-fill bar-fill--enemy"></i></div>
          <span class="hud-hp" id="hud-enemy-hp-text"></span>
        </div>
      </div>

      <div id="voice-feed" class="voice-feed"></div>

      <div class="hud-bottom">
        <div class="hud-meters">
          <div id="hud-ammo" class="ammo"></div>
          <div class="super"><i id="hud-super" class="super-fill"></i></div>
        </div>
      </div>

      <div id="move-zone" class="stick-zone">
        <span class="stick-base"></span>
        <span id="move-knob" class="stick-knob"></span>
      </div>

      <div class="match-buttons">
        <button id="btn-menu" type="button" class="chip">תפריט</button>
        <button id="btn-rematch" type="button" class="chip">מחדש</button>
      </div>
    </div>
  </div>

  <p id="boot-error" class="boot-error" hidden>
    לא הצלחתי לטעון את נתוני הדמויות. פתח דרך שרת מקומי ולא כקובץ.
  </p>

  <script src="data/characters.fallback.js"></script>
  <script src="src/core/combat.js"></script>
  <script src="src/core/arena-layout.js"></script>
  <script type="module" src="src/three/main.js"></script>
</body>
</html>
